<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Forms</title></head><body>
<form name="careers" data-netlify="true" netlify-honeypot="bot-field" hidden enctype="multipart/form-data">
  <input type="hidden" name="form-name" value="careers"/>
  <input type="text" name="name"/>
  <input type="email" name="email"/>
  <input type="tel" name="phone"/>
  <input type="text" name="position"/>
  <textarea name="message"></textarea>
  <input type="file" name="cv"/>
</form>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact"/>
  <input type="text" name="name"/>
  <input type="email" name="email"/>
  <input type="tel" name="phone"/>
  <input type="text" name="subject"/>
  <textarea name="message"></textarea>
</form>
<form name="grievance" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="grievance"/>
  <input type="text" name="name"/>
  <input type="email" name="email"/>
  <input type="tel" name="phone"/>
  <input type="text" name="role"/>
  <input type="text" name="category"/>
  <textarea name="grievance"></textarea>
</form>
<form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="enquiry"/>
  <input type="text" name="name"/>
  <input type="tel" name="mobile"/>
  <input type="email" name="email"/>
  <input type="text" name="organisation"/>
  <input type="text" name="designation"/>
  <input type="text" name="qualification"/>
  <input type="text" name="program"/>
</form>
<form name="weglobal" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="weglobal"/>
  <input type="text" name="name"/>
  <input type="tel" name="contact"/>
  <input type="email" name="email"/>
  <input type="text" name="course"/>
  <input type="text" name="campus"/>
</form>
<form name="mdc-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="mdc-enquiry"/>
  <input type="text" name="name"/>
  <input type="email" name="email"/>
  <input type="tel" name="phone"/>
  <input type="text" name="organisation"/>
  <input type="text" name="interest"/>
  <textarea name="message"></textarea>
</form>
</body></html>
